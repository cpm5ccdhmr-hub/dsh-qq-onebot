# dsh-qq bundle patch
#
# 通过 `dsh plugin --profile <name> add dsh-qq-onebot` 安装后，dsh 启动时自动加载本 patch。
#
# 前置：本机需要跑一个 NapCat（或任何 OneBot 11 实现），并开启「正向 WebSocket」服务，
# 默认地址 ws://127.0.0.1:3001。详见 README.md。
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch
# 注意：后层 patch 是「整行替换 config」，不是深合并。要覆盖这里某个键，请把整块 config 重写一遍。
#
# ⚠️ 这里写的值会盖住 src/config.js 的 schema 默认值（本 patch 后应用，以本 patch 为准）。
#    改默认值 = 这两个文件一起改；只改一边的话，用户看到的行为跟代码里的默认值对不上
#    （1.2.1 就栽过：schema 的 wsUrl 改成空，这里还留着 3001，于是「没配就不连」永远走不到）。
#    test/patch-defaults.test.mjs 会盯着两边是否一致。

- insert:
    - id: dsh-qq
      # ⚠️ 必须等于 package.json 的 name：0.2.x 的 client-modules 用 manifest 包名
      # 当浏览器模块身份，name 对不上就整条 client row 进不了启动图（设置页消失）。
      name: 'dsh-qq-onebot'
      config:
        # ── 连接 ──
        # 留空 = 不连接。填 NapCat 的地址（常见 ws://127.0.0.1:3001）才连；
        # 不要在这里替用户填个地址，否则连不上时用户会以为是自己配错了。
        wsUrl: ''
        accessToken: ''
        selfId: ''
        reconnectMs: 5000

        # ── Agent ──
        # provider/model/preset/cwd 留空 = 跟随宿主默认
        directPrompt: ''
        groupPrompt: ''
        historyLimit: 20

        # ── 触发 ──
        requireMention: true
        replyToPrivate: true
        groupMode: open
        groupAllow: []
        # 私聊默认只认白名单：能私聊这个号的人，就能指挥跑在用户机器上的 agent。
        # 白名单空着 = 谁都不理；要放人进来把 QQ 号填进 privateAllow。
        privateMode: allowlist
        privateAllow: []

        # ── 输出 ──
        textChunkLimit: 1500
        showToolResults: false
        splitDelayMs: 400

        # ── 其他 ──
        sessionIdleTimeout: 1800000
        debug: false
